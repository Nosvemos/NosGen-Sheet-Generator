version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the Linux binary
    deps:
      - task: common:go:mod:tidy
      - task: common:update:build-assets
      - task: common:generate:icons
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
    cmds:
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}"
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if .EXTRA_TAGS}}-tags {{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'
    env:
      GOOS: linux
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_ENABLED: 1

  run:
    summary: Runs the built Linux application
    deps:
      - task: build
        vars:
          DEV:
            ref: .DEV
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
